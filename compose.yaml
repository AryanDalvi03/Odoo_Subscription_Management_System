services:
  mongo:
    image: mongo:8
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:27018:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok === 1 ? quit(0) : quit(1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); quit(1) }",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6380:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    profiles: ['app']
    env_file: .env
    build: { context: ., dockerfile: infra/docker/node.Dockerfile }
    environment:
      NODE_ENV: development
      PORT: 4000
      WEB_ORIGIN: http://localhost:5173
      MONGODB_URI: mongodb://mongo:27017/subscriptiq?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    profiles: ['app']
    env_file: .env
    build: { context: ., dockerfile: infra/docker/node.Dockerfile }
    command: ['node', 'apps/worker/dist/index.js']
    environment:
      MONGODB_URI: mongodb://mongo:27017/subscriptiq?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      MAIL_DIRECTORY: /app/var/mail
    volumes: ['mail-data:/app/var/mail']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  mongo-data:
  redis-data:
  mail-data:
